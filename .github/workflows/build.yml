name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -project TrollInstallerX.xcodeproj -scheme TrollInstallerX \
            -configuration Release -sdk iphoneos -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package
        run: |
          APP=dd/Build/Products/Release-iphoneos/TrollInstallerX.app
          ls -l "$APP" | head
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry TrollInstallerX-unsigned.ipa Payload
          ls -lh TrollInstallerX-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TrollInstallerX-unsigned
          path: TrollInstallerX-unsigned.ipa
